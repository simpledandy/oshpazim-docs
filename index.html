---
# Front matter makes GitHub Pages (Jekyll) render this page.
# The policy text lives only in PRIVACY_POLICY.md; edit that file, not this one.
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oshpazim Privacy Policy</title>
    <meta name="description" content="Privacy policy for the Oshpazim Android app, in English and Uzbek.">
    <style>
        :root {
            --bg: #f6f3ef;
            --page: #ffffff;
            --text: #2c2520;
            --muted: #6b625b;
            --accent: #b8321b;
            --rule: #e6ded6;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1512;
                --page: #231c17;
                --text: #efece9;
                --muted: #b3aaa2;
                --accent: #f08a4b;
                --rule: #3a302a;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
            line-height: 1.6;
        }
        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 32px 16px 64px;
            background: var(--page);
            min-height: 100vh;
        }
        h1 { font-size: 1.8em; line-height: 1.25; margin: 0 0 12px; }
        h2 {
            font-size: 1.5em;
            margin: 40px 0 8px;
            padding-bottom: 6px;
            border-bottom: 2px solid var(--accent);
        }
        h3 { font-size: 1.15em; margin: 28px 0 8px; }
        p, ul { margin: 0 0 14px; }
        ul { padding-left: 22px; }
        li { margin-bottom: 6px; }
        a { color: var(--accent); }
        hr { border: none; border-top: 1px solid var(--rule); margin: 40px 0; }
        @media (min-width: 600px) {
            main { padding: 48px 40px 80px; }
        }
    </style>
</head>
<body>
    <main>
{% capture policy %}{% include_relative PRIVACY_POLICY.md %}{% endcapture %}
{{ policy | markdownify }}
    </main>
</body>
</html>
