<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oshpazim - Privacy Policy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; line-height: 1.6; color: #333; background-color: #f5f5f5; }
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; background-color: white; min-height: 100vh; }
        h1 { color: #222; margin-bottom: 10px; font-size: 2.5em; }
        h2 { color: #444; margin-top: 30px; margin-bottom: 15px; font-size: 1.8em; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        h3 { color: #555; margin-top: 20px; margin-bottom: 10px; font-size: 1.3em; }
        p { margin-bottom: 15px; text-align: justify; }
        ul { margin-left: 25px; margin-bottom: 15px; }
        li { margin-bottom: 10px; }
        strong { color: #222; }
        .last-updated { color: #888; font-style: italic; margin-bottom: 30px; }
        hr { margin: 40px 0; border: none; border-top: 2px solid #ddd; }
        code { background-color: #f4f4f4; padding: 2px 6px; border-radius: 3px; font-family: 'Courier New', Courier, monospace; }
        .language-switch { display: flex; gap: 10px; margin-bottom: 30px; }
        .language-switch a { padding: 8px 16px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px; cursor: pointer; }
        .language-switch a.active { background-color: #0056b3; }
        .language-switch a:hover { background-color: #0056b3; }
        .section { display: none; }
        .section.active { display: block; }
        /* Basic markdown styling */
        .md h1 { font-size: 2.2em; margin-bottom: 10px; }
        .md h2 { font-size: 1.6em; margin-top: 24px; margin-bottom: 8px; }
        .md h3 { font-size: 1.2em; margin-top: 18px; margin-bottom: 8px; }
        .md p { margin-bottom: 12px; }
        .md ul { margin-left: 20px; margin-bottom: 12px; }
        .md li { margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="language-switch">
            <a href="#" onclick="showLanguage('en'); return false;" class="active" id="btn-en">English</a>
            <a href="#" onclick="showLanguage('uz'); return false;" id="btn-uz">O'zbek</a>
        </div>

        <div id="content">
            <p class="last-updated">Loading privacy policy…</p>
        </div>
    </div>

    <script>
        // Minimal markdown -> HTML renderer for the features used in PRIVACY_POLICY.md
        function renderMarkdown(markdown) {
            const lines = markdown.replace(/\r\n/g,'\n').split('\n');
            const sections = [];
            let current = { title: null, lines: [] };

            function pushCurrent() {
                if (current.title !== null || current.lines.length) {
                    sections.push(current);
                }
            }

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                if (line.startsWith('# ')) {
                    // new top-level section
                    pushCurrent();
                    current = { title: line.replace(/^#\s+/, '').trim(), lines: [] };
                } else {
                    current.lines.push(line);
                }
            }
            pushCurrent();

            // Convert lines of a section to HTML
            function linesToHtml(lines) {
                let out = '';
                let inList = false;
                lines.forEach((raw) => {
                    const line = raw.trim();
                    if (!line) {
                        if (inList) { out += '</ul>'; inList = false; }
                        return;
                    }
                    if (line === '---') {
                        if (inList) { out += '</ul>'; inList = false; }
                        out += '<hr>';
                        return;
                    }
                    // Heading level 2/3
                    if (line.startsWith('## ')) { if (inList) { out += '</ul>'; inList = false; } out += '<h2>' + escapeHtml(line.replace(/^##\s+/, '')) + '</h2>'; return; }
                    if (line.startsWith('### ')) { if (inList) { out += '</ul>'; inList = false; } out += '<h3>' + escapeHtml(line.replace(/^###\s+/, '')) + '</h3>'; return; }
                    // Unordered list
                    if (line.startsWith('* ')) {
                        if (!inList) { out += '<ul>'; inList = true; }
                        out += '<li>' + formatInline(line.replace(/^\*\s+/, '')) + '</li>';
                        return;
                    }
                    // Paragraph
                    if (inList) { out += '</ul>'; inList = false; }
                    out += '<p>' + formatInline(line) + '</p>';
                });
                if (inList) { out += '</ul>'; inList = false; }
                return out;
            }

            // Basic inline formatting: bold **text**
            function formatInline(text) {
                return escapeHtml(text).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            }

            function escapeHtml(str) {
                return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            // Build HTML with sections mapped to ids 'en' and 'uz' when possible
            const container = document.createElement('div');
            sections.forEach((sec) => {
                const sectionEl = document.createElement('div');
                const id = (sec.title && /uzbek|maxfiylik|uz/i.test(sec.title)) ? 'uz' : 'en';
                sectionEl.id = id + '-' + Math.random().toString(36).slice(2,8);
                sectionEl.className = 'section md';
                // Title
                if (sec.title) {
                    sectionEl.innerHTML += '<h1>' + escapeHtml(sec.title) + '</h1>';
                }
                sectionEl.innerHTML += linesToHtml(sec.lines);
                container.appendChild(sectionEl);
            });

            return container;
        }

        async function loadAndRender() {
            try {
                const resp = await fetch('./PRIVACY_POLICY.md');
                if (!resp.ok) throw new Error('Failed to load PRIVACY_POLICY.md');
                const md = await resp.text();
                const rendered = renderMarkdown(md);

                // Split into top-level language sections by detecting the two H1 headings
                // We'll map first H1 -> English, second H1 -> Uzbek if titles indicate language.
                const contentEl = document.getElementById('content');
                contentEl.innerHTML = ''; // clear

                // Find top-level H1 blocks in rendered
                const children = Array.from(rendered.children);
                // Heuristic: group nodes between H1s
                const groups = [];
                let currentGroup = null;
                children.forEach((node) => {
                    if (node.tagName.toLowerCase() === 'h1') {
                        if (currentGroup) groups.push(currentGroup);
                        currentGroup = { title: node.textContent || '', nodes: [node] };
                    } else {
                        if (!currentGroup) currentGroup = { title: '', nodes: [node] };
                        else currentGroup.nodes.push(node);
                    }
                });
                if (currentGroup) groups.push(currentGroup);

                // Create language sections
                let enSection = document.createElement('div');
                enSection.id = 'en'; enSection.className = 'section active md';
                let uzSection = document.createElement('div');
                uzSection.id = 'uz'; uzSection.className = 'section md';

                groups.forEach((g, idx) => {
                    const title = (g.title || '').toLowerCase();
                    const target = (/maxfiylik|uzbek|ozbek/.test(title) || idx === 1) ? uzSection : enSection;
                    g.nodes.forEach(n => target.appendChild(n.cloneNode(true)));
                });

                // If no explicit sections found, just append everything to en
                if (enSection.children.length === 0 && uzSection.children.length === 0) {
                    contentEl.appendChild(rendered);
                } else {
                    contentEl.appendChild(enSection);
                    contentEl.appendChild(uzSection);
                }

                // Update language buttons state
                document.getElementById('btn-en').classList.add('active');
                document.getElementById('btn-uz').classList.remove('active');

            } catch (err) {
                document.getElementById('content').innerHTML = '<p class="last-updated">Unable to load privacy policy.</p>';
                console.error(err);
            }
        }

        function showLanguage(lang) {
            const en = document.getElementById('en');
            const uz = document.getElementById('uz');
            if (en) en.classList.remove('active');
            if (uz) uz.classList.remove('active');
            document.getElementById('btn-en').classList.remove('active');
            document.getElementById('btn-uz').classList.remove('active');
            if (lang === 'en' && en) { en.classList.add('active'); document.getElementById('btn-en').classList.add('active'); }
            if (lang === 'uz' && uz) { uz.classList.add('active'); document.getElementById('btn-uz').classList.add('active'); }
        }

        loadAndRender();
    </script>
</body>
</html>
